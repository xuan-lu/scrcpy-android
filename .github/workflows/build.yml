name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在网页随时手动点击打包

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 获取主代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2. 手动克隆兼容性最好的 boringssl 稳定版本
      - name: Clone boringssl manually
        run: |
          rm -rf app/src/main/cpp/boringssl
          git clone --depth 1 https://boringssl.googlesource.com/boringssl app/src/main/cpp/boringssl

      # 3. 配置 Java 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 降级安装稳定的 NDK 25.2.9519653（解决 Clang 18 / NDK 27 的 C++ 编译报错问题）
      - name: Install Stable NDK 25
        run: |
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      # 5. 赋予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. 创建 Android Debug Keystore
      - name: Create Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 7. 开始云端编译 Debug 版 APK
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 8. 上传编译成功的 APK 安装包
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
