name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 允许您随时在网页手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 获取主代码仓库
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2. 手动克隆缺失的 boringssl 依赖库到正确位置
      - name: Clone boringssl manually
        run: |
          rm -rf app/src/main/cpp/boringssl
          git clone --depth 1 https://boringssl.googlesource.com/boringssl app/src/main/cpp/boringssl

      # 3. 配置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 赋予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 编译 Debug 版 APK
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 6. 上传 APK 产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
