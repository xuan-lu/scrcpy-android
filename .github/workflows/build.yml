name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 允许您随时在网页手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 获取代码（使用 v5 避免 Node 警告，fetch-depth: 0 防止 git 拉取报 128 错误）
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. 配置 Java 环境（升级到 v5，如果项目需要 JDK 11，把 '17' 换成 '11' 即可）
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 初始化 Gradle 缓存（解决网络下载超时导致的构建失败）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 赋予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 编译 Debug 版 APK，并加上 --stacktrace 方便出错时排查
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 6. 上传 APK 产物（确保路径匹配，如果找不到文件会报错）
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: scrcpy-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
